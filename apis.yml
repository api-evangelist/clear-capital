name: Clear Capital
kind: company
description: Clear Capital is a real-estate valuation and property data platform serving
  mortgage lenders, investors, and capital markets. Its developer surface is exposed
  through two sales-led REST products - the Property Analytics API (ClearAVM automated
  valuations, comparables ranked by ClearRank, property characteristics, and market
  trends) and the Property Valuation API (ordering and fulfillment of appraisal and
  valuation products such as Hybrid/Desktop appraisal, BPO, CDA, and UDC). Access is
  gated behind a commercial agreement; full reference docs live at docs.api.clearcapital.com.
