specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Clear Capital
providerId: clear-capital
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Real Estate
- Property Data
- Valuation
- AVM
- Appraisal
- Mortgage
- Rate Limiting
- Quotas
- Throttling
description: >-
  Clear Capital does not publicly document rate limits, quotas, or throttling
  behavior for its Property Analytics API or Property Valuation API. Any limits
  are governed by the customer's commercial agreement and are described in the
  gated developer portal. Specific values are not reconciled in this artifact.
notes: >-
  Confirm request-rate, concurrency, and volume limits with Clear Capital during
  onboarding or via the developer portal (docs.api.clearcapital.com) on
  reconciliation. Throttling response codes are assumed to follow standard HTTP
  semantics (429) but are not publicly confirmed.
sources:
- https://www.clearcapital.com/products/property-analytics-api/
- https://www.clearcapital.com/products/property-valuation-api/
- https://docs.api.clearcapital.com/introduction
responseCodes:
  throttled: 429
limits:
- name: Request Rate
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Not publicly documented; governed by commercial agreement.
- name: Volume / Quota
  scope: account
  metric: valuations_or_orders
  limit: see provider documentation
  notes: Per-product volume terms are negotiated and not publicly published.
policies:
- name: Negotiated Limits
  description: Limits are set per commercial agreement rather than via public self-service tiers.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header if returned.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
